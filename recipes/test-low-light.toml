# Test set at a quarter of the calibrated exposures, so twice the relative shot
# noise. Same seeds and groups as test.toml; its ideal holograms are the test
# set's at a quarter of the counts, so they equal them after normalisation up to rounding.
[dataset]
total_samples = 1000
seed = 200000

[objects]
red_blood_cells_background_electrons = 684.0  # e- per pixel, 2735 / 4
adherent_cells_background_electrons = 464.0  # e- per pixel, 1855 / 4
